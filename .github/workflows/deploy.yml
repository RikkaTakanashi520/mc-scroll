name: Deploy to GitHub Pages

# 什么时候跑：
#   1. 推送到 main
#   2. 手动触发
#
# 重要设计：**不在 CI 里抓数据**。
#
# 最初的版本让 CI 跑 crawl.mjs 全量抓取（40 分钟）+ enrich + 翻译，
# 结果实测跑 14 分钟还没进到构建阶段，GitHub Actions 免费额度会被吃光，
# 而且很容易撞默认 6 小时超时。
#
# 数据是「构建产物」而不是「源码」——正确的做法是本地导出 dist/ 后
# 推到一个专门的分支（gh-pages），这个 workflow 只负责发布。
#
# 想自动化更新数据，用 scripts/publish-pages.mjs（本地跑，会推送 gh-pages 分支）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # dist/ 由本地 scripts/build-static.mjs 生成后推送到 gh-pages 分支。
      # 这里直接切到那个分支取现成产物，不重新抓数据。
      - name: Fetch prebuilt site from gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages --depth=1
            git worktree add ./_site origin/gh-pages
            echo "::notice::使用 gh-pages 分支的预构建产物"
          else
            echo "::error::gh-pages 分支不存在。请先在本地运行 node scripts/publish-pages.mjs"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
