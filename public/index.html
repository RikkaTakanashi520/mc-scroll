<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <title>MC Scroll — Discover Minecraft mods, modpacks &amp; more</title>
    <meta name="description" content="Scroll Minecraft mods, modpacks, datapacks, resource packs and shaders like a short-video feed. Save favourites, jump to the original page." />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- 桌面端三栏容器；手机端这些栏会隐藏，feed 独占全屏 -->
      <div class="layout">
        <!-- ============ 左侧：分类导航（仅桌面端显示） ============ -->
        <aside class="sidebar" id="sidebar" aria-label="Browse categories">
          <div class="sidebar-head">
            <div class="brand" id="brandBtn">
              <span class="brand-mark">MC</span>
              <span class="brand-text">Scroll</span>
            </div>
          </div>
          <nav class="sidebar-nav" id="sidebarNav"></nav>
          <div class="sidebar-foot">
            <button class="side-btn" id="langBtn" title="Switch language">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9S14.5 18.5 12 21M12 3c-2.5 2.5-3.8 5.7-3.8 9S9.5 18.5 12 21" fill="none" stroke="currentColor" stroke-width="1.6" />
              </svg>
              <span id="langLabel">English</span>
              <span class="side-lang" id="langShort">EN</span>
            </button>
            <button class="side-btn" id="sideSavedBtn">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
              <span id="sideSavedLabel">Saved</span>
              <span class="side-count" id="sideSavedCount">0</span>
            </button>
          </div>
        </aside>

        <!-- ============ 中间：内容流（手机端全屏） ============ -->
        <main id="feed" class="feed" aria-label="Content feed">
          <div id="feedTrack" class="feed-track">
            <div class="feed-spacer" aria-hidden="true"></div>
          </div>

          <div id="bootSkeleton" class="boot-skeleton">
            <div class="skel-hero"></div>
            <div class="skel-lines">
              <div class="skel-line w40"></div>
              <div class="skel-line w80"></div>
              <div class="skel-line w60"></div>
            </div>
          </div>

          <header class="topbar">
            <div class="brand brand-mobile" id="brandBtnMobile">
              <span class="brand-mark">MC</span>
              <span class="brand-text">Scroll</span>
            </div>
            <!-- 顶部频道条已移除：桌面端用左侧栏导航，移动端用筛选面板，
                 两处都能选类型，顶部再放一排属于重复。 -->
            <div class="topbar-spacer"></div>
            <div class="top-actions">
              <button class="icon-btn" id="filterBtn" aria-label="Filters" data-i18n-aria="filters">
                <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
                  <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span class="top-badge" id="filterBadge" hidden>0</span>
              </button>
            <button class="icon-btn" id="savedBtn" aria-label="Saved" data-i18n-aria="saved">
              <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
                <path id="savedIconPath" d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
              <span class="top-badge" id="savedBadge" hidden>0</span>
            </button>
            <button class="icon-btn" id="searchBtn" aria-label="Search" data-i18n-aria="search">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm5.5-2 5 5" />
              </svg>
            </button>
            <button class="icon-btn" id="keysBtn" aria-label="Keyboard shortcuts" data-i18n-aria="shortcuts" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
                <rect x="2.5" y="6" width="19" height="12" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.9" />
                <path d="M6 10h1.6M9.6 10h1.6M13.2 10h1.6M16.8 10H18M6 13.4h1.6M9.6 13.4h1.6M13.2 13.4h1.6M16.8 13.4H18M7.4 16.2h9.2"
                      fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </header>

        <!-- 快捷键面板：右上角展开，列出全部键位 -->
        <div class="keys-pop" id="keysPop" hidden role="dialog" aria-label="Keyboard shortcuts">
          <div class="keys-head">
            <h3 data-i18n="shortcuts">Keyboard shortcuts</h3>
            <button class="icon-btn sm" id="keysClose" aria-label="Close" data-i18n-aria="close">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
            </button>
          </div>
          <div class="keys-body" id="keysBody"></div>
        </div>

        <aside class="rail" aria-label="Actions">
          <button class="rail-btn" id="saveBtn" aria-pressed="false" aria-label="Save">
            <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
              <path class="star-path" d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z" />
            </svg>
            <span class="rail-count" id="saveCount">0</span>
          </button>
          <button class="rail-btn" id="galleryBtn" aria-label="All screenshots">
            <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M3 15.5l4.2-4.2a1.6 1.6 0 0 1 2.3 0l3 3 2-2a1.6 1.6 0 0 1 2.3 0L21 16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <circle cx="8.2" cy="9.4" r="1.4" />
            </svg>
            <span class="rail-count" id="imgCount"></span>
          </button>
          <button class="rail-btn" id="linkBtn" aria-label="Open original page">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
              <path d="M14 4h6v6M20 4l-8.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M18 14.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="rail-label" data-i18n="open">Open</span>
          </button>
          <button class="rail-btn" id="copyBtn" aria-label="Copy link">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2.4" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M15 6.5A2.5 2.5 0 0 0 12.5 4H6a2 2 0 0 0-2 2v6.5A2.5 2.5 0 0 0 6.5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="rail-label" data-i18n="copy">Copy</span>
          </button>
        </aside>

        <section class="info" id="info" aria-live="polite">
          <div class="info-badges" id="infoBadges"></div>
          <h1 class="info-title" id="infoTitle"></h1>
          <p class="info-desc" id="infoDesc"></p>
          <div class="info-actions">
            <button class="primary-btn" id="openBtn" data-i18n="viewOnModrinth">View on Modrinth</button>
            <button class="ghost-btn" id="detailBtn" data-i18n="details">Details</button>
          </div>
          <div class="progress" aria-hidden="true">
            <div class="progress-thumbs" id="progressThumbs"></div>
          </div>
        </section>

        <div class="gallery-dots" id="galleryDots" aria-hidden="true"></div>
      </main>

      <!-- ============ 右侧：当前内容详情（仅桌面端显示） ============ -->
      <aside class="detailbar" id="detailbar" aria-label="Project details">
        <button class="detailbar-toggle" id="detailbarToggle" aria-expanded="true" aria-controls="detailbarInner">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="detailbar-inner" id="detailbarInner"></div>
      </aside>
      </div><!-- /.layout -->

      <!-- Details sheet -->
      <div class="sheet" id="sheet" hidden>
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <div class="sheet-handle"></div>
          <button class="sheet-close" data-close-sheet aria-label="Close" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          </button>
          <div class="sheet-body" id="sheetBody"></div>
        </div>
      </div>

      <!-- Filters -->
      <div class="panel" id="filterPanel" hidden>
        <header class="panel-head">
          <button class="icon-btn" id="filterBack" aria-label="Back" data-i18n-aria="back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <h2 data-i18n="filters">Filters</h2>
          <button class="text-btn" id="filterReset" data-i18n="reset">Reset</button>
        </header>
        <div class="panel-scroll" id="filterBody"></div>
        <div class="panel-footer">
          <button class="primary-btn wide" id="filterApply" data-i18n="applyFilters">Apply filters</button>
        </div>
      </div>

      <!-- Saved -->
      <div class="panel" id="savedPanel" hidden>
        <header class="panel-head">
          <button class="icon-btn" id="savedBack" aria-label="Back" data-i18n-aria="back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <h2><span data-i18n="savedTitle">My saved</span> <span id="savedTotal" class="muted"></span></h2>
          <button class="text-btn" id="savedClear" data-i18n="clear">Clear</button>
        </header>
        <div class="panel-content" id="savedList"></div>
      </div>

      <!-- Search -->
      <div class="panel" id="searchPanel" hidden>
        <header class="panel-head">
          <button class="icon-btn" id="searchBack" aria-label="Back" data-i18n-aria="back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <input id="searchInput" class="search-input" type="search" placeholder="Search mods, modpacks, datapacks…" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
        </header>
        <div class="panel-content" id="searchResults"></div>
      </div>

      <div class="lightbox" id="lightbox" hidden>
        <button class="lb-close" id="lbClose" aria-label="Close" data-i18n-aria="close">×</button>
        <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous" data-i18n-aria="previous">‹</button>
        <img id="lbImg" alt="" />
        <button class="lb-nav lb-next" id="lbNext" aria-label="Next" data-i18n-aria="next">›</button>
        <div class="lb-caption" id="lbCaption"></div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="fatal" id="fatal" hidden>
        <h2 data-i18n="noData">No data</h2>
        <p id="fatalMsg"></p>
        <pre>node scripts/crawl.mjs --all</pre>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
